<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hack Club Site</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            border: 2px solid #ec3750;
        }
        h1 { color: #ec3750; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.5; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #ec3750;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Vedh Sharma</h1>
        <p>Welcome to my first Hack Club project! Built this personal site using HTML/CSS.</p>
        <a href="https://hackclub.com" class="btn">Visit Hack Club</a>
    </div>
</body>
</html>
